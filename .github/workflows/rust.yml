name: Rust

on:
  push:
    branches: [ "main" ]
  # Без фільтра гілок: фільтр перевіряє base, а в stacked PR base — не main.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Застарілий прогін PR скасовується; прогони push у main — ніколи.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Без аргументів читає rust-toolchain.toml разом із components.
      - run: rustup toolchain install
      - run: cargo fmt --check

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      # Після toolchain: ключ кешу містить версію rustc.
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
