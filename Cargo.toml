[package]
name = "llmrt"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
bytes = "1.12.1"
futures-util = "0.3.34"
mdns-sd = "0.21.3"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
tempfile = "3.27.0"

[[bin]]
name = "llmrt"
path = "src/main.rs"

[[bin]]
name = "fake-llama-server"
path = "src/bin/fake-llama-server.rs"
